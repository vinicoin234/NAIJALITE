<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NAIJALITE | Live, Chat & Earn</title>
  <meta name="theme-color" content="#008751">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    :root {
      --primary: #008751; --primary-dark: #006b40; --accent: #ffc107; --danger: #ff4757;
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-dim: #94a3b8; --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: var(--bg); color: var(--text); 
      height: 100svh; width: 100vw; 
      max-width: 480px; margin: 0 auto; 
      overflow: hidden; display: flex; flex-direction: column;
    }

    #loadingScreen { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* AUTH */
    #authScreen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .auth-wrapper { width: 100%; max-width: 340px; text-align: center; }
    .auth-logo { width: 100px; height: 100px; border-radius: 20px; object-fit: cover; border: 3px solid var(--primary); background: white; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .auth-card { background: var(--card); padding: 24px; border-radius: 24px; border: 1px solid var(--border); }
    .auth-input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; color: white; margin-bottom: 15px; font-size: 1rem; }
    .btn-auth { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; }

    /* HEADER */
    header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 20px 16px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; z-index: 100; shrink: 0; }
    .wallet-card { background: rgba(255, 255, 255, 0.15); padding: 12px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }

    /* MAIN CONTENT AREA */
    .main-content { flex: 1; overflow-y: auto; padding: 16px; position: relative; padding-bottom: 80px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s; }

    /* LIVE STREAMING */
    .live-container { position: relative; width: 100%; height: 65vh; background: #000; border-radius: 24px; overflow: hidden; margin-bottom: 20px; }
    .main-video { width: 100%; height: 100%; object-fit: cover; }
    .live-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    .overlay-top, .overlay-bottom { pointer-events: auto; }
    .chat-area { height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; mask-image: linear-gradient(transparent, black 20%); }
    .chat-msg { background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 12px; font-size: 0.8rem; color: white; width: fit-content; max-width: 80%; backdrop-filter: blur(5px); animation: fadeInUp 0.3s; }
    .action-bar { display: flex; align-items: center; gap: 10px; }
    .chat-input { flex: 1; padding: 12px 15px; border-radius: 25px; border: none; background: rgba(255,255,255,0.2); color: white; outline: none; font-size: 1rem; }
    .gift-mall-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); border: none; font-size: 1.5rem; cursor: pointer; }

    /* GIFT MALL */
    .gift-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
    .gift-item { background: #0f172a; padding: 12px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
    .gift-item:active { transform: scale(0.9); border-color: var(--accent); }

    /* INBOX - WhatsApp Style */
    .inbox-list { display: flex; flex-direction: column; gap: 2px; }
    .chat-preview { background: var(--card); padding: 12px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #2a364a; }
    .avatar-circle { width: 50px; height: 50px; border-radius: 50%; background: #334155; object-fit: cover; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-info h4 { font-size: 0.95rem; margin-bottom: 2px; }
    .chat-info p { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-window { position: fixed; inset: 0; background: var(--bg); z-index: 2500; display: none; flex-direction: column; }
    .chat-header { background: var(--card); padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 15px; border-radius: 15px; max-width: 75%; font-size: 0.9rem; line-height: 1.4; }
    .msg.sent { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
    .msg.received { align-self: flex-start; background: var(--card); color: white; border-bottom-left-radius: 2px; }

    /* PROFILE */
    .profile-header { text-align: center; padding: 20px 0; }
    .profile-pic-container { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
    .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); }
    .emoji-reaction { position: absolute; bottom: 0; right: 0; background: white; border-radius: 50%; padding: 5px; cursor: pointer; font-size: 1.2rem; }

    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--card); display: flex; border-top: 1px solid var(--border); z-index: 100; height: 65px; }
    .nav-item { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.7rem; color: var(--text-dim); cursor: pointer; }
    .nav-item.active { color: var(--primary); }
    .nav-item div { font-size: 1.3rem; margin-bottom: 2px; }

    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { background: var(--card); width: 100%; max-width: 400px; border-radius: 24px; padding: 24px; color: white; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Loading NAIJALITE...</p>
  </div>

  <div id="authScreen">
    <div class="auth-wrapper">
      <img src="https://i.ibb.co/4gmXV5P8/PNG-1.jpg" class="auth-logo">
      <h2 class="auth-title" style="font-size:1.6rem; font-weight:800; color:white; margin-bottom:5px;">NAIJALITE</h2>
      <p class="auth-subtitle" style="color:var(--text-dim); font-size:0.85rem; margin-bottom:20px;">Live, Chat & Earn</p>
      <div class="auth-card">
        <input type="text" id="authEmail" class="auth-input" placeholder="Email, Phone or Username">
        <input type="password" id="authPass" class="auth-input" placeholder="Password">
        <button class="btn-auth" onclick="handleAuth()">Login / Sign Up</button>
      </div>
    </div>
  </div>

  <header>
    <div class="header-top" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h1 style="font-size:1.3rem; font-weight:800;">🇳🇬 NAIJALITE</h1>
      <span style="font-size: 0.8rem; opacity: 0.9;">Online 🟢</span>
    </div>
    <div class="wallet-card">
      <div class="wallet-info">
        <span style="font-size: 0.75rem; opacity: 0.9; display: block;">Balance | Coins</span>
        <strong id="walletBalance">₦0.00</strong> | 🟡 <strong id="userCoins">0</strong>
      </div>
      <button class="btn-withdraw" style="background:var(--accent); color:#000; border:none; padding:8px 14px; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="openModal('coinModal')">Top Up</button>
    </div>
  </header>

  <div class="main-content">
    <!-- LIVE TAB -->
    <div id="liveTab" class="tab-content active">
      <div class="live-container">
        <video id="hostVideo" class="main-video" autoplay playsinline muted></video>
        <div class="live-overlay">
          <div class="overlay-top" style="display:flex; justify-content:space-between;">
            <div class="live-badge" style="background:var(--danger); color:white; padding:4px 12px; border-radius:6px; font-size:0.7rem; font-weight:bold; animation:pulse 1.5s infinite;">🔴 LIVE</div>
            <button style="background:var(--accent); border:none; padding:8px 12px; border-radius:12px; font-weight:bold; font-size:0.7rem;" onclick="shareStream()">📤 Share</button>
          </div>
          <div class="overlay-bottom">
            <div class="chat-area" id="chatArea"></div>
            <div class="action-bar">
              <div class="chat-input-wrapper" style="flex:1; display:flex; gap:10px;">
                <input type="text" id="chatInput" class="chat-input" placeholder="Say something..." onclick="this.focus()">
              </div>
              <button class="gift-mall-btn" onclick="openModal('giftMallModal')">🎁</button>
            </div>
          </div>
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="btn-main" id="btnStreamToggle" onclick="toggleStream()" style="flex:1; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Start Live</button>
        <button class="btn-main" id="btnJoinStage" onclick="joinStage()" style="flex:1; padding:14px; background:#3182ce; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Join Stage</button>
      </div>
    </div>

    <!-- INBOX TAB -->
    <div id="inboxTab" class="tab-content">
      <h3 style="margin-bottom:15px;">Messages</h3>
      <div class="inbox-list" id="inboxList">
        <p style="text-align:center; color:var(--text-dim); margin-top:20px;">Loading conversations...</p>
      </div>
    </div>

    <!-- EARN TAB -->
    <div id="earnTab" class="tab-content">
      <div class="card" style="background:var(--card); padding:20px; border-radius:20px; border:1px solid var(--border);">
        <h3 style="margin-bottom:15px; text-align:center; color:var(--accent);">🏆 Top Gifters</h3>
        <div id="leaderboardList"></div>
      </div>
    </div>

    <!-- PROFILE TAB -->
    <div id="profileTab" class="tab-content">
      <div class="profile-header">
        <div class="profile-pic-container">
          <img src="https://via.placeholder.com/120" id="myProfilePic" class="profile-pic">
          <div class="emoji-reaction" onclick="reactPhoto('❤️')">❤️</div>
        </div>
        <h3 id="userNameDisplay">Loading...</h3>
        <p id="userIdDisplay" style="color:var(--text-dim); font-size:0.8rem;"></p>
        <div style="margin-top:15px;">
          <label class="btn-main" style="display:inline-block; width:auto; padding:8px 20px; cursor:pointer; font-size:0.8rem; background:var(--primary); color:white; border-radius:12px; font-weight:bold;">
            Upload Photo <input type="file" id="picUpload" style="display:none" onchange="uploadPhoto(this)">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALS -->
  <div id="giftMallModal" class="modal-bg">
    <div class="modal-card">
      <h3 style="margin-bottom:10px;">🎁 Gift Mall</h3>
      <div class="gift-grid" id="giftGrid"></div>
      <button class="btn-auth" style="margin-top:20px; background:var(--border);" onclick="closeModal('giftMallModal')">Close</button>
    </div>
  </div>

  <div id="coinModal" class="modal-bg">
    <div class="modal-card">
      <h3 style="margin-bottom:10px;">🪙 Buy Coins</h3>
      <select id="coinPack" class="auth-input" style="width:100%; padding:12px; background:#0f172a; border:1px solid var(--border); border-radius:12px; color:white; margin-bottom:15px;">
        <option value="1000">100 Coins - ₦1,000</option>
        <option value="2500">260 Coins - ₦2,500</option>
        <option value="5000">550 Coins - ₦5,000</option>
      </select>
      <input type="email" id="userEmail" class="auth-input" placeholder="Email" style="width:100%; padding:12px; background:#0f172a; border:1px solid var(--border); border-radius:12px; color:white; margin-bottom:15px;">
      <button class="btn-auth" onclick="payWithPaystack()">Pay Now</button>
      <button class="btn-auth" style="margin-top:10px; background:none; color:white;" onclick="closeModal('coinModal')">Cancel</button>
    </div>
  </div>

  <!-- REAL CHAT WINDOW -->
  <div id="chatWindow" class="chat-window">
    <div class="chat-header">
      <button onclick="closeChat()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">←</button>
      <img src="https://via.placeholder.com/40" class="avatar-circle">
      <div style="flex:1;">
        <h4 id="chatTargetName">User</h4>
        <span style="font-size:0.7rem; color:var(--primary);">Online</span>
      </div>
      <div style="display:flex; gap:15px; font-size:1.2rem; cursor:pointer;">
        <span>📞</span><span>📹</span>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="action-bar" style="padding:15px; background:var(--card); border-top:1px solid var(--border);">
      <input type="text" id="privateChatInput" class="chat-input" placeholder="Type a message..." onclick="this.focus()">
      <button onclick="sendPrivateMessage()" style="background:var(--primary); color:white; border:none; padding:10px 15px; border-radius:20px; cursor:pointer; font-weight:bold;">Send</button>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('liveTab', this)"><div>🔴</div>Live</div>
    <div class="nav-item" onclick="switchTab('inboxTab', this)"><div>💬</div>Inbox</div>
    <div class="nav-item" onclick="switchTab('earnTab', this)"><div>🎯</div>Earn</div>
    <div class="nav-item" onclick="switchTab('profileTab', this)"><div>⚙️</div>Profile</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hwiddexgiwtduuzprsjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yMXYUylVnkixM7Y-qWdiaA_a0hBx9R4';
    let supabase, userId, agentId;
    let isStreaming = false;
    let isOnStage = false;
    let currentChatUser = null;
    let userCoins = 0;

    const gifts = [
      { name: 'Rose 🌹', cost: 10 }, { name: 'Crown 👑', cost: 50 },
      { name: 'Car 🏎️', cost: 200 }, { name: 'Lion 🦁', cost: 500 },
      { name: 'Diamond 💎', cost: 1000 }, { name: 'Jet ✈️', cost: 5000 }
    ];

    const giftSound = new Audio('https://www.myinstants.com/media/sounds/cash-register-purchase.mp3');

    async function initSupabase() {
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        document.getElementById('loadingScreen').style.display = 'none';
        checkSession();
        setupRealtimeChat();
      } catch (e) { console.error(e); }
    }

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        userId = session.user.id;
        document.getElementById('authScreen').style.display = 'none';
        await initHub();
      } else {
        document.getElementById('authScreen').style.display = 'flex';
      }
    }

    async function handleAuth() {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPass').value;
      if(!email || !pass) return alert('Fill all fields');
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
        if (error) await supabase.auth.signUp({ email, password: pass });
        location.reload();
      } catch (e) { alert(e.message); }
    }

    async function initHub() {
      agentId = 'NL-' + Math.floor(100000 + Math.random() * 900000);
      await supabase.from('profiles').upsert({ id: userId, agent_id: agentId });
      await fetchWallet();
      document.getElementById('userIdDisplay').textContent = 'Agent ID: ' + agentId;
      updateUI();
      loadInbox();
      loadProfile();
    }

    async function fetchWallet() {
      const { data } = await supabase.from('wallets').select('*').eq('id', userId).single();
      if (data) { userCoins = data.coin_balance; } 
      else { await supabase.from('wallets').insert([{ id: userId, cash_balance: 1000, coin_balance: 100 }]); userCoins = 100; }
    }

    function updateUI() {
      document.getElementById('userCoins').textContent = userCoins;
    }

    /* STREAMING LOGIC */
    async function toggleStream() {
      const btn = document.getElementById('btnStreamToggle');
      const joinBtn = document.getElementById('btnJoinStage');
      const video = document.getElementById('hostVideo');

      if (!isStreaming) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          video.srcObject = stream;
          isStreaming = true;
          btn.textContent = 'End Live';
          btn.style.background = 'var(--danger)';
          joinBtn.disabled = true;
          joinBtn.style.opacity = '0.5';
        } catch (e) { alert('Camera access required'); }
      } else {
        if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        isStreaming = false;
        btn.textContent = 'Start Live';
        btn.style.background = 'var(--primary)';
        joinBtn.disabled = false;
        joinBtn.style.opacity = '1';
      }
    }

    function joinStage() {
      if (isStreaming) return alert('You cannot join another stage while streaming!');
      isOnStage = true;
      document.getElementById('btnJoinStage').textContent = 'Leave Stage';
      document.getElementById('btnStreamToggle').disabled = true;
      document.getElementById('btnStreamToggle').style.opacity = '0.5';
      addChatMessage("You joined the stage! 🎤");
    }

    function shareStream() {
      const url = window.location.href;
      navigator.clipboard.writeText(url);
      alert('Stream link copied! Share it in the inbox.');
    }

    /* GIFT MALL */
    function openModal(id) { document.getElementById(id).style.display = 'flex'; if(id==='giftMallModal') loadGiftMall(); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function loadGiftMall() {
      const grid = document.getElementById('giftGrid');
      grid.innerHTML = '';
      gifts.forEach(g => {
        const div = document.createElement('div');
        div.className = 'gift-item';
        div.innerHTML = `<div style="font-size:1.5rem;">${g.name.split(' ')[1] || g.name}</div><div style="color:var(--accent); font-weight:bold; font-size:0.8rem;">🟡 ${g.cost}</div>`;
        div.onclick = () => sendGift(g);
        grid.appendChild(div);
      });
    }

    async function sendGift(gift) {
      if (userCoins < gift.cost) return alert('Not enough coins!');
      giftSound.play().catch(e => {});
      userCoins -= gift.cost;
      await supabase.from('wallets').update({ coin_balance: userCoins }).eq('id', userId);
      
      const anim = document.createElement('div');
      anim.className = 'gift-animation animate__animated animate__fadeInUp';
      anim.textContent = gift.name;
      document.querySelector('.live-container').appendChild(anim);
      setTimeout(() => anim.remove(), 3000);
      
      await supabase.from('messages').insert([{ sender_id: userId, content: `Sent a ${gift.name}! 🎁` }]);
      updateUI();
      closeModal('giftMallModal');
    }

    /* REALTIME CHAT */
    function setupRealtimeChat() {
      supabase.channel('live_chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const msg = payload.new.content;
        addChatMessage(msg);
      }).subscribe();
    }

    function addChatMessage(msg) {
      const area = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.textContent = msg;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    /* INBOX & MESSAGING */
    async function loadInbox() {
      const { data } = await supabase.from('profiles').select('*').neq('id', userId);
      const list = document.getElementById('inboxList');
      list.innerHTML = '';
      if(!data || data.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--text-dim); margin-top:20px;">No conversations yet.</p>';
        return;
      }
      data.forEach(u => {
        const div = document.createElement('div');
        div.className = 'chat-preview';
        div.innerHTML = `<img src="${u.avatar_url || 'https://via.placeholder.com/50'}" class="avatar-circle">
                         <div class="chat-info"><h4>${u.username || 'User'}</h4><p>Tap to chat...</p></div>`;
        div.onclick = () => openChat(u);
        list.appendChild(div);
      });
    }

    function openChat(user) {
      currentChatUser = user;
      document.getElementById('chatTargetName').textContent = user.username || 'User';
      document.getElementById('chatWindow').style.display = 'flex';
      loadPrivateMessages(user.id);
    }

    function closeChat() { document.getElementById('chatWindow').style.display = 'none'; }

    async function loadPrivateMessages(targetId) {
      const { data } = await supabase.from('messages').select('*').or(`and(sender_id.eq.${userId},receiver_id.eq.${targetId}),and(sender_id.eq.${targetId},receiver_id.eq.${userId})`).order('created_at', { ascending: true });
      const area = document.getElementById('chatMessages');
      area.innerHTML = '';
      (data || []).forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.sender_id === userId ? 'sent' : 'received'}`;
        div.textContent = m.content;
        area.appendChild(div);
      });
      area.scrollTop = area.scrollHeight;
    }

    async function sendPrivateMessage() {
      const input = document.getElementById('privateChatInput');
      const text = input.value.trim();
      if (!text) return;
      await supabase.from('messages').insert([{ sender_id: userId, receiver_id: currentChatUser.id, content: text }]);
      input.value = '';
      loadPrivateMessages(currentChatUser.id);
    }

    /* PROFILE SOCIAL */
    async function loadProfile() {
      const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
      if (data) {
        document.getElementById('userNameDisplay').textContent = data.username || 'User';
        document.getElementById('myProfilePic').src = data.avatar_url || 'https://via.placeholder.com/120';
      }
    }

    async function uploadPhoto(input) {
      const file = input.files[0];
      if (!file) return;
      alert('Photo uploaded successfully!');
    }

    function reactPhoto(emoji) {
      alert('Reacted with ' + emoji + ' ❤️');
    }

    function switchTab(id, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
      if (id === 'inboxTab') loadInbox();
    }

    window.onload = () => {
      initSupabase();
      loadGiftMall();
    };
  </script>
</body>
</html>
