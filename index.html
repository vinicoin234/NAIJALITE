  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://hwiddexgiwtduuzprsjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yMXYUylVnkixM7Y-qWdiaA_a0hBx9R4';
    
    // FIXED: Capital 'S' in Supabase.createClient
    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLoginMode = true;
    let currentBalance = 0;
    let userCoins = 0;
    let userId = null;
    let agentId = '';

    // --- AUTH LOGIC ---
    function switchAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('authTitle').textContent = isLoginMode ? 'Welcome to Naijalite' : 'Create Account';
      document.getElementById('authDesc').textContent = isLoginMode ? 'Join the hub, stream and earn!' : 'Start your journey today!';
      document.getElementById('btnAuthAction').textContent = isLoginMode ? 'Login' : 'Sign Up';
      document.getElementById('toggleAuth').innerHTML = isLoginMode ? 'Don\'t have an account? <span style="color:var(--accent); font-weight:bold;">Sign Up</span>' : 'Already have an account? <span style="color:var(--accent); font-weight:bold;">Login</span>';
    }

    async function handleAuth() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPass').value;

      if (!email || !password) return alert('Please fill in all fields');

      try {
        if (isLoginMode) {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } else {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;
        }
        
        localStorage.setItem('naijalite_session', 'true');
        checkSession();
      } catch (error) {
        alert('Authentication Error: ' + error.message);
      }
    }

    async function checkSession() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (session) {
        userId = session.user.id;
        document.getElementById('authScreen').style.display = 'none';
        await initHub();
      } else {
        document.getElementById('authScreen').style.display = 'flex';
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      localStorage.removeItem('naijalite_session');
      location.reload();
    }

    // --- HUB LOGIC ---
    async function initHub() {
      agentId = 'NL-' + Math.floor(100000 + Math.random() * 900000);
      
      try {
        // Ensure Profile exists
        await supabase.from('profiles').upsert({ id: userId, agent_id: agentId });
        
        // Load Wallet
        await fetchWallet();
        
        document.getElementById('userIdDisplay').textContent = 'Agent ID: ' + agentId;
        document.getElementById('userRefLink').textContent = window.location.origin + window.location.pathname + '?ref=' + agentId;
        updateUI();
      } catch (err) {
        console.error('Hub Init Error:', err);
      }
    }

    async function fetchWallet() {
      const { data, error } = await supabase.from('wallets').select('*').eq('id', userId).single();
      if (data) {
        currentBalance = data.cash_balance;
        userCoins = data.coin_balance;
      } else {
        // Create default wallet if missing
        await supabase.from('wallets').insert([{ id: userId, cash_balance: 1650, coin_balance: 100 }]);
        currentBalance = 1650;
        userCoins = 100;
      }
    }

    function updateUI() {
      document.getElementById('walletBalance').textContent = '₦' + currentBalance.toLocaleString();
      document.getElementById('userCoins').textContent = userCoins;
    }

    // --- TIKTOK GIFTING ---
    async function sendGroupGift(name, cost) {
      if (userCoins < cost) return alert('Insufficient coins!');

      userCoins -= cost;
      
      try {
        await supabase.from('wallets').update({ coin_balance: userCoins }).eq('id', userId);
        
        const anim = document.createElement('div');
        anim.className = 'gift-animation animate__animated animate__fadeInUp';
        anim.textContent = name.split(' ')[1] || name;
        document.querySelector('.live-container').appendChild(anim);
        
        addChatMessage(`Sent a ${name}! 🚀`, true);
        setTimeout(() => anim.remove(), 3000);
        updateUI();
      } catch (err) {
        alert('Error updating coins: ' + err.message);
      }
    }

    function addChatMessage(msg, isGift = false) {
      const chat = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = isGift ? `<b style="color:var(--accent)">Gift:</b> ${msg}` : `<b style="color:var(--accent)">You:</b> ${msg}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function toggleGroupStream() {
      const btn = document.getElementById('btnStreamToggle');
      const video = document.getElementById('hostVideo');
      if (btn.textContent === 'Start Live') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          video.srcObject = stream;
          btn.textContent = 'End Live';
          btn.style.background = 'var(--danger)';
        } catch (err) { alert('Camera access required.'); }
      } else {
        if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        btn.textContent = 'Start Live';
        btn.style.background = 'var(--primary)';
      }
    }

    function switchTab(id, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function payWithPaystack() {
      const email = document.getElementById('userEmail').value;
      const amount = parseInt(document.getElementById('coinPack').value);
      if (!email) return alert('Email required');
      
      PaystackPop.setup({
        key: 'pk_test_sample_key', email, amount: amount * 100, currency: "NGN",
        callback: async () => {
          userCoins += Math.floor(amount/10);
          await supabase.from('wallets').update({ coin_balance: userCoins }).eq('id', userId);
          updateUI();
          closeModal('coinModal');
        }
      }).openIframe();
    }

    function openWhatsApp() {
      let num = document.getElementById('waPhone').value.trim();
      if (!num) return;
      if (num.startsWith('0')) num = num.substring(1);
      window.open('https://wa.me/234' + num, '_blank');
    }

    function copyRefLink() {
      navigator.clipboard.writeText(document.getElementById('userRefLink').textContent);
      alert('Link Copied!');
    }

    window.onload = checkSession;
  </script>
